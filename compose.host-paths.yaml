services:
  postgres:
    volumes:
      - ${STREAMFORGE_POSTGRES_HOST_PATH:-./docker-data/postgres}:/var/lib/postgresql/data

  api:
    volumes:
      - ${STREAMFORGE_MEDIA_HOST_PATH:-./docker-data/uploads}:/app/data/uploads
      - ${STREAMFORGE_TRANSCRIPTION_OUTPUT_HOST_PATH:-./docker-data/transcription-output}:/app/data/transcription-output

  transcription-worker:
    volumes:
      - ${STREAMFORGE_MEDIA_HOST_PATH:-./docker-data/uploads}:/app/data/uploads
      - ${STREAMFORGE_TRANSCRIPTION_OUTPUT_HOST_PATH:-./docker-data/transcription-output}:/app/data/transcription-output
      - ${STREAMFORGE_TRANSCRIPTION_MODEL_CACHE_HOST_PATH:-./docker-data/transcription-models}:/root/.cache
