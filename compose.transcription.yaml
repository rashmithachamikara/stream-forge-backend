services:
  api:
    environment:
      Transcription__Enabled: ${STREAMFORGE_TRANSCRIPTION_ENABLED:-true}
      Transcription__AutoTranscribeOnReady: ${STREAMFORGE_TRANSCRIPTION_AUTO_ON_READY:-true}
      Transcription__WorkerBaseUrl: http://transcription-worker:8090
      Transcription__CallbackBaseUrl: http://api:8080
      Transcription__WorkerCallbackSecret: ${STREAMFORGE_TRANSCRIPTION_CALLBACK_SECRET:-}
      Transcription__WorkerCallbackAuthHeader: ${STREAMFORGE_TRANSCRIPTION_CALLBACK_HEADER:-X-StreamForge-Worker-Secret}
      Transcription__LocalFasterWhisper__Model: ${STREAMFORGE_TRANSCRIPTION_MODEL:-small}
      Transcription__LocalFasterWhisper__Device: ${STREAMFORGE_TRANSCRIPTION_DEVICE:-cpu}
      Transcription__LocalFasterWhisper__ComputeType: ${STREAMFORGE_TRANSCRIPTION_COMPUTE_TYPE:-int8}
      Transcription__LocalFasterWhisper__BeamSize: ${STREAMFORGE_TRANSCRIPTION_BEAM_SIZE:-5}
      Transcription__LocalFasterWhisper__EnableVad: ${STREAMFORGE_TRANSCRIPTION_ENABLE_VAD:-true}
      Transcription__LocalFasterWhisper__EnableWordTimestamps: ${STREAMFORGE_TRANSCRIPTION_ENABLE_WORD_TIMESTAMPS:-false}

  transcription-worker:
    build:
      context: ./services/transcription-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      STREAMFORGE_LOCAL_STORAGE_ROOT: /app/data
      TRANSCRIPTION_WORKER_SHARED_MEDIA_ROOT: /app/data/uploads
      TRANSCRIPTION_WORKER_OUTPUT_ROOT: /app/data/transcription-output
      TRANSCRIPTION_WORKER_CALLBACK_AUTH_HEADER: ${STREAMFORGE_TRANSCRIPTION_CALLBACK_HEADER:-X-StreamForge-Worker-Secret}
      TRANSCRIPTION_WORKER_CALLBACK_SECRET: ${STREAMFORGE_TRANSCRIPTION_CALLBACK_SECRET:-}
      TRANSCRIPTION_WORKER_DEFAULT_MODEL: ${STREAMFORGE_TRANSCRIPTION_MODEL:-small}
      TRANSCRIPTION_WORKER_DEFAULT_DEVICE: ${STREAMFORGE_TRANSCRIPTION_DEVICE:-cpu}
      TRANSCRIPTION_WORKER_DEFAULT_COMPUTE_TYPE: ${STREAMFORGE_TRANSCRIPTION_COMPUTE_TYPE:-int8}
      TRANSCRIPTION_WORKER_DEFAULT_BEAM_SIZE: ${STREAMFORGE_TRANSCRIPTION_BEAM_SIZE:-5}
      TRANSCRIPTION_WORKER_ENABLE_VAD: ${STREAMFORGE_TRANSCRIPTION_ENABLE_VAD:-true}
      TRANSCRIPTION_WORKER_WORD_TIMESTAMPS: ${STREAMFORGE_TRANSCRIPTION_ENABLE_WORD_TIMESTAMPS:-false}
    ports:
      - "${STREAMFORGE_TRANSCRIPTION_WORKER_PORT:-8090}:8090"
    volumes:
      - streamforge_shared_data:/app/data
      - streamforge_transcription_models:/root/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  streamforge_transcription_models:
