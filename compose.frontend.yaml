services:
  frontend:
    build:
      context: ../stream-forge-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      STREAMFORGE_PUBLIC_API_URL: ${STREAMFORGE_PUBLIC_API_URL:?Set a browser-reachable API origin}
      STREAMFORGE_ANALYTICS_INGESTION_ENABLED: ${STREAMFORGE_ANALYTICS_INGESTION_ENABLED:-true}
      STREAMFORGE_ANALYTICS_SEND_ANONYMOUS: ${STREAMFORGE_ANALYTICS_SEND_ANONYMOUS:-true}
      STREAMFORGE_ANALYTICS_TRACK_PAUSE: ${STREAMFORGE_ANALYTICS_TRACK_PAUSE:-true}
      STREAMFORGE_ANALYTICS_TRACK_SEEK: ${STREAMFORGE_ANALYTICS_TRACK_SEEK:-true}
      STREAMFORGE_ANALYTICS_TRACK_CLOSE: ${STREAMFORGE_ANALYTICS_TRACK_CLOSE:-true}
      STREAMFORGE_ANALYTICS_ENDPOINT_BASE_URL: ${STREAMFORGE_ANALYTICS_ENDPOINT_BASE_URL:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${STREAMFORGE_FRONTEND_PORT:-3000}:3000"

